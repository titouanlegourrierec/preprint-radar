# Git hooks, run by prek (a faster pre-commit, pinned in uv.lock like the tools below, so
# local runs, hooks and CI agree). Install with: uv run prek install

# Fixtures are verbatim copies of arXiv pages and data/ is generated: keep them untouched.
exclude: ^(tests/fixtures|data)/

repos:
  # prek's own Rust versions of the pre-commit-hooks checks: offline, nothing to update.
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: biome
        name: biome check (web)
        entry: bash -c 'cd web && npx --no-install biome check --write --no-errors-on-unmatched'
        language: system
        files: ^web/
        pass_filenames: false
      - id: tsc
        name: tsc (web)
        entry: bash -c 'cd web && npm run --silent typecheck'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
