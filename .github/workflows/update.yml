name: Update data

# arXiv announces new papers Sunday to Thursday at 20:00 US Eastern time (00:00 or
# 01:00 UTC) and rebuilds its RSS feeds at midnight Eastern time (04:00 or 05:00 UTC),
# so the data is refreshed after both, Monday to Friday. The odd minute avoids the
# top-of-the-hour load on GitHub's scheduler, which may still delay runs by hours.
on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      max-html:
        description: Maximum number of HTML pages to read per category
        default: "600"
      since:
        description: Collect every day from this date on (YYYY-MM-DD), e.g. after missed runs
        default: ""

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Reading HTML pages is throttled to one every 15 s (arxiv.org robots.txt).
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      CATEGORIES: ${{ vars.PREPRINT_RADAR_CATEGORIES || 'cs.CV' }}
      # Defaults to the repository URL, so that forks never send someone else's address.
      PREPRINT_RADAR_CONTACT: ${{ vars.PREPRINT_RADAR_CONTACT || format('{0}/{1}', github.server_url, github.repository) }}
      MAX_HTML: ${{ inputs.max-html || '600' }}
      SINCE: ${{ inputs.since }}
      # Optional: without it, Semantic Scholar is queried anonymously, slowly.
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The latest main, not the commit the run was triggered on: a run queued behind
          # another one must start from the data that run pushed.
          ref: main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      - name: Fetch papers
        # Stop early enough to commit what was fetched; progress is saved as it goes.
        timeout-minutes: 210
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          if [ -n "$SINCE" ]; then
            # Catchup pages of every day since SINCE, with abstracts, then affiliations.
            uv run --no-dev preprint-radar -v backfill "${args[@]}" --since "$SINCE" --max-html "$MAX_HTML"
          else
            # Recent listing; abstracts from RSS and catchup pages, then affiliations.
            uv run --no-dev preprint-radar -v update "${args[@]}" --max-html "$MAX_HTML"
          fi

      - name: Fetch citation counts of new papers
        # A paper or two hundred: one or two requests. Semantic Scholar learns new papers
        # within days, so some are left for the next run; the weekly archive refreshes all.
        # A refusing Semantic Scholar is given up after 10 minutes, and the papers are asked
        # for again tomorrow; a rejected key fails the step.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v citations "${args[@]}" --max-minutes 10

      # Even after a failed or cancelled fetch: progress is saved as it goes.
      - name: Validate data
        id: validate
        if: always()
        # Structural errors stop the push (the data is kept below); warnings only go to
        # the job summary.
        run: bash .github/scripts/validate-data.sh

      - name: Commit data
        id: commit
        if: ${{ always() && steps.validate.outcome == 'success' }}
        # main may have moved during the run, which lasts hours: the script replays the
        # commit on top, settling conflicts on index.json and citations.json.
        run: |
          bash .github/scripts/commit-data.sh "chore(data): update $(date -u +%Y-%m-%d)"

      - name: Keep the data that failed validation
        if: ${{ always() && steps.validate.outcome == 'failure' }}
        run: |
          bash .github/scripts/commit-data.sh --keep "chore(data): update $(date -u +%Y-%m-%d), not validated"

      - name: Keep the data commit that could not be pushed
        if: ${{ failure() && (steps.commit.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-commit
          path: data-commit.bundle
          retention-days: 7

  deploy:
    needs: update
    # Whenever data was pushed, even by a run that failed later (partial data is still
    # data), and never when nothing changed.
    if: ${{ !cancelled() && needs.update.outputs.pushed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
