name: Update data

# arXiv announces new papers Sunday to Thursday at 20:00 US Eastern time (00:00 or
# 01:00 UTC) and rebuilds its RSS feeds at midnight Eastern time (04:00 or 05:00 UTC),
# so the data is refreshed after both, Monday to Friday. GitHub's scheduler starts runs
# hours late (09:52 to 13:29 for 06:17 in a week), so an outside scheduler dispatches
# this workflow at 06:17 UTC (docs/operations.md). The schedule is its fallback, four
# hours later: the guard job stops it when a run of the day already succeeded.
on:
  schedule:
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
    inputs:
      max-html:
        description: Maximum number of HTML pages to read per category (empty for the pipeline's default)
        default: ""
      since:
        description: Collect every day from this date on (YYYY-MM-DD), e.g. after missed runs
        default: ""

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # A scheduled run is the fallback of the outside scheduler's dispatch: it stops when a
  # run of the day already succeeded, and always in a fork (.github/scripts/skip-if-done.sh).
  # No `if:` on this job: skipped, it leaves `run` empty, which the next job reads as go.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/skip-if-done.sh update.yml

  update:
    needs: guard
    # Also when the guard failed: a second run costs minutes, a missed one a day.
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # Reading HTML pages is throttled to one every 15 s (arxiv.org robots.txt). Steps: 195
    # minutes of papers, 15 of re-extraction, seconds of OpenAlex (5 at most), 15 of citation
    # counts, then a few to commit.
    timeout-minutes: 240
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      CATEGORIES: ${{ vars.PREPRINT_RADAR_CATEGORIES || 'cs.CV' }}
      # Defaults to the repository URL, so that forks never send someone else's address.
      PREPRINT_RADAR_CONTACT: ${{ vars.PREPRINT_RADAR_CONTACT || format('{0}/{1}', github.server_url, github.repository) }}
      # Empty on a scheduled run: the pipeline's default (DEFAULT_MAX_HTML in config.py).
      MAX_HTML: ${{ inputs.max-html }}
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The latest main, not the commit the run was triggered on: a run queued behind
          # another one must start from the data that run pushed.
          ref: main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      # The front matter of every HTML page read (a few KB each) lives in the Actions cache,
      # not in git: `reextract` reads them again offline. Each run saves a new entry, even
      # after a failure, so that the cache is touched daily and never evicted.
      - name: Restore the page cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/front-matter
          key: front-matter-${{ github.run_id }}
          restore-keys: front-matter-

      # The archive's catalog (about 118 MB), restored only to keep it in the cache: GitHub
      # evicts an entry unused for 7 days, and a Sunday run that starts late (the fallback,
      # which GitHub starts hours late) found none on 2026-10-11 and harvested the whole
      # catalog again (CI-10). Nothing here reads it.
      - name: Keep the archive's catalog in the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-kept-alive
          restore-keys: catalog-

      - name: Fetch papers
        # Stop early enough to commit what was fetched; progress is saved as it goes. The
        # deadline leaves 20 minutes for ROR and the last save before the step is killed.
        timeout-minutes: 195
        run: |
          args=(--deadline-minutes 175)
          for category in $CATEGORIES; do args+=(--category "$category"); done
          if [ -n "$MAX_HTML" ]; then args+=(--max-html "$MAX_HTML"); fi
          if [ -n "$SINCE" ]; then
            # Catchup pages of every day since SINCE, with abstracts, then affiliations.
            uv run --no-dev preprint-radar -v backfill "${args[@]}" --since "$SINCE"
          else
            # Recent listing; abstracts from RSS and catchup pages, then affiliations.
            uv run --no-dev preprint-radar -v update "${args[@]}"
          fi

      - name: Extract stored papers again
        # Papers read by an older version of the extraction: from the page cache, then up
        # to 50 pages downloaded a day, so that fixes reach the stored data by themselves.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          args=(--max-html 50 --deadline-minutes 12)
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v reextract "${args[@]}"

      - name: Save the page cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/front-matter
          key: front-matter-${{ github.run_id }}

      - name: Ask OpenAlex for the affiliations of papers without an HTML page
        # No page gives theirs (about 5% of the papers): a few requests, seconds. Those it
        # knows nothing of yet are asked again every 30 days; a failing OpenAlex leaves them
        # for the next run.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v affiliations "${args[@]}"

      - name: Ask OpenAlex for the countries of new institutions
        # For the site's map (UX-40): the institutions of the day's papers that no stored
        # paper had, a request or none; those it fails to place are asked for again.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v countries "${args[@]}"

      - name: Fetch citation counts of new papers
        # A paper or two hundred: one or two requests. Semantic Scholar learns new papers
        # within days, so some are left for the next run; the weekly archive refreshes all.
        # A refusing Semantic Scholar is given up after 10 minutes, and the papers are asked
        # for again tomorrow; a rejected key fails the step.
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          # Optional: without it, Semantic Scholar is queried anonymously, slowly. Given to
          # the steps that ask Semantic Scholar only.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v citations "${args[@]}" --max-minutes 10

      - name: Fetch the stars of new papers' code
        # The papers without a record in code.json (PROD-18): those announced since the
        # weekly archive, which refreshes every paper and counts the week's gains, and
        # those whose repository GitHub did not know yet. A query or two, seconds; the
        # workflow's own token reads public data.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v code --new "${args[@]}"

      # Even after a failed or cancelled fetch: progress is saved as it goes.
      - name: Validate data
        id: validate
        if: always()
        # Structural errors stop the push (the data is kept below); warnings only go to
        # the job summary.
        run: bash .github/scripts/validate-data.sh

      - name: Commit data
        id: commit
        if: ${{ always() && steps.validate.outcome == 'success' }}
        # main may have moved during the run, which lasts hours: the script replays the
        # commit on top, settling conflicts on index.json and citations.json.
        run: |
          bash .github/scripts/commit-data.sh "chore(data): update $(date -u +%Y-%m-%d)"

      - name: Keep the data that failed validation
        if: ${{ always() && steps.validate.outcome == 'failure' }}
        run: |
          bash .github/scripts/commit-data.sh --keep "chore(data): update $(date -u +%Y-%m-%d), not validated"

      - name: Keep the data commit that could not be pushed
        if: ${{ failure() && (steps.commit.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-commit
          path: data-commit.bundle
          retention-days: 7

      # The newest day and its age, the coverage tables and stale warnings, on the run's
      # page; the steps above add their own report lines.
      - name: Summary
        if: always()
        run: uv run --no-dev preprint-radar summary

  deploy:
    needs: update
    # Whenever data was pushed, even by a run that failed later (partial data is still
    # data), and never when nothing changed.
    if: ${{ !cancelled() && needs.update.outputs.pushed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
