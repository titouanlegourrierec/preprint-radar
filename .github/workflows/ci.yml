name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A burst of pushes is tested once, on its last commit, which holds the others. No path
# filter: the data job below validates the maintainer's data pushes, and the web job builds
# the site from data/.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The matrix's static flag stays out of the check names: python (3.13), python (3.14).
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
        # Formatting, lint, types and workflows do not depend on the Python version: they
        # run on one entry only.
        include:
          - python-version: "3.13"
            static: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - if: matrix.static
        run: uv run ruff format --check .
      - if: matrix.static
        run: uv run ruff check .
      - if: matrix.static
        run: uv run ty check
      - if: matrix.static
        run: uv run actionlint
      - run: uv run pytest --cov

  # Bot pushes do not trigger this workflow: the data workflows validate before committing.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Validate data
        run: bash .github/scripts/validate-data.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # The built site in a browser, over the small store of web/e2e/data.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
