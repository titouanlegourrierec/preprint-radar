name: arXiv canary

# The pipeline's parsers against the live arXiv, weekly: a layout change shows up here as
# a red run before it reaches the data (the fixtures in tests/fixtures/ stay as they were).
# The same day, the size of the repository, which every data commit makes grow.
on:
  schedule:
    - cron: "23 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# Neither job runs on schedule when the event says the repository is a fork, only by hand:
# a fork that turns Actions on must not crawl arXiv weekly (CI-11), as the data workflows'
# guard stops their schedules (.github/scripts/skip-if-done.sh).
jobs:
  canary:
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    # About ten pages at arxiv.org's 15 s crawl delay.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m network
        env:
          # Sent to arxiv.org only, so given to this step only (PUB-6).
          PREPRINT_RADAR_CONTACT: ${{ vars.PREPRINT_RADAR_CONTACT || format('{0}/{1}', github.server_url, github.repository) }}

  repository-size:
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    # A mirror clone and its repack: about two minutes.
    timeout-minutes: 15
    steps:
      # GitHub's size of the repository (KB, about what a clone downloads): above 500 MB, move
      # data/ off main (docs/operations.md, "The site or the repository grows").
      - name: Check the repository size
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          size=$(( $(gh api "repos/$REPOSITORY" --jq .size) / 1024 ))
          echo "**Repository size.** ${size} MB (warning above 500 MB)" >> "$GITHUB_STEP_SUMMARY"
          # Also an annotation, which the API keeps, unlike the summary: the size's history (SCALE-2).
          echo "::notice title=Repository size::${size} MB"
          if [ "$size" -gt 500 ]; then
            echo "::warning title=Repository growing::the repository is ${size} MB, above the 500 MB migration trigger"
          fi
      # GitHub stores the weekly rewrites of archive/ against bases of its own choosing
      # (2024.json as a 2.4 MB delta on 2025.json, where its last version gives 16 KB):
      # its size above counts that bloat, which a repack of the same objects leaves out
      # (SCALE-1). Several times the repacked size: ask GitHub Support to gc the
      # repository; data that grows the repacked size: the migration of docs/operations.md.
      - name: Check the size the data takes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git clone --quiet --mirror "https://github.com/$REPOSITORY.git" mirror.git
          git -C mirror.git repack -q -adf --window=50 --depth=50
          packed=$(( $(du -sk mirror.git/objects/pack | cut -f1) / 1024 ))
          size=$(( $(gh api "repos/$REPOSITORY" --jq .size) / 1024 ))
          echo "**Repacked size.** ${packed} MB, GitHub's ${size} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Repacked size::${packed} MB, GitHub's ${size} MB"
          if [ "$size" -gt $(( 3 * packed )) ]; then
            echo "::warning title=Storage bloat::GitHub stores ${size} MB for ${packed} MB of repacked objects: ask GitHub Support to gc the repository (docs/operations.md)"
          fi
