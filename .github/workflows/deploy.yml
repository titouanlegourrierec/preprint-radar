name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called after a data update, build the commit that was just pushed.
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # GitHub Pages refuses a site over 1 GB. Fail well before it, and warn at the size that
      # calls for moving data/ off main (docs/operations.md, "The site or the repository grows").
      - name: Check the site size
        working-directory: web
        run: |
          size=$(du -sm dist | cut -f1)
          echo "**Site size.** ${size} MB (warning above 600 MB, failure above 800 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 800 ]; then
            echo "::error title=Site too large::web/dist is ${size} MB, above the 800 MB guard (Pages refuses 1 GB)"
            exit 1
          elif [ "$size" -gt 600 ]; then
            echo "::warning title=Site growing::web/dist is ${size} MB, above the 600 MB migration trigger"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
