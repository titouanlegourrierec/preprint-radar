name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

# Each job gets what it needs, no more: the build, which runs npm packages, holds no token
# that can deploy. The callers' deploy jobs (update.yml, archive.yml) grant what the two
# jobs below ask for together, and each job narrows it.
permissions: {}

# A running deploy finishes: one cancelled half-way leaves the data workflow that called it
# without success, so that workflow's scheduled fallback runs it all again
# (.github/scripts/skip-if-done.sh). GitHub still replaces an older pending run with the
# newer one, and every deploy builds the latest main: the newest content always ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's settings (its address, for the feeds).
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # When called after a data update, build the commit that was just pushed.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # A maintainer's push deploys as CI starts: test the app first. The data workflows'
      # deploys (workflow_call, under their own event) change data only and skip it.
      - name: Test the app
        if: github.event_name == 'push'
        run: npm test
        working-directory: web
      # Before the build: the Atom feeds' links need the site's address (tooling/feeds.ts).
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
        working-directory: web
        env:
          PREPRINT_RADAR_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # GitHub Pages refuses a site over 1 GB. Fail well before it, and warn at the size that
      # calls for moving data/ off main (docs/operations.md, "The site or the repository grows").
      - name: Check the site size
        working-directory: web
        run: |
          size=$(du -sm dist | cut -f1)
          echo "**Site size.** ${size} MB (warning above 600 MB, failure above 800 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 800 ]; then
            echo "::error title=Site too large::web/dist is ${size} MB, above the 800 MB guard (Pages refuses 1 GB)"
            exit 1
          elif [ "$size" -gt 600 ]; then
            echo "::warning title=Site growing::web/dist is ${size} MB, above the 600 MB migration trigger"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
