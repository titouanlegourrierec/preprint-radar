name: Archive

# Weekly: keep the most cited papers older than 12 months, within a size budget (see
# src/preprint_radar/archive/update.py). Sunday morning UTC: the daily update does not run then.
# An outside scheduler dispatches it at 05:41 UTC; the schedule is the fallback, four hours
# later, and stops when a run of the day already succeeded (see update.yml). When both fail,
# Saturday catches up, while the counts they fetched are cached (7 days), and stops when a
# run succeeded since Sunday (CI-8): a week later, everything would be asked for again.
on:
  schedule:
    - cron: "41 9 * * 0"
    - cron: "41 5 * * 6"
  workflow_dispatch:
    inputs:
      budget:
        description: Number of older papers the archive holds (empty for the repository variable, else 22000)
        default: ""
      prune:
        description: Delete the day files older than 12 months (true/false; empty for the repository variable)
        default: ""

# Shared with update.yml, so that two data commits never race.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # A scheduled run is the fallback of the outside scheduler's dispatch: it stops when a
  # run of the day already succeeded, and always in a fork (.github/scripts/skip-if-done.sh).
  # No `if:` on this job: skipped, it leaves `run` empty, which the next job reads as go.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Saturday's catch-up looks back to Sunday; Sunday's fallback, at today.
          DAYS_BACK: ${{ github.event.schedule == '41 5 * * 6' && '6' || '0' }}
        run: bash .github/scripts/skip-if-done.sh archive.yml "$DAYS_BACK"

  archive:
    needs: guard
    # Also when the guard failed: a second run costs minutes, a missed one a week.
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    # The first run harvests the whole catalog (about 45 minutes); every run then fetches
    # about 207,000 citation counts in 415 requests, far slower without an API key, then
    # the published versions of the stored papers, their affiliations for the highly cited
    # papers without any, and the stars of the code they link.
    timeout-minutes: 330
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      CATEGORIES: ${{ vars.PREPRINT_RADAR_CATEGORIES || 'cs.CV' }}
      # Sent to arXiv's OAI-PMH only, as in update.yml.
      PREPRINT_RADAR_CONTACT: ${{ vars.PREPRINT_RADAR_CONTACT || format('{0}/{1}', github.server_url, github.repository) }}
      ARCHIVE_BUDGET: ${{ inputs.budget || vars.PREPRINT_RADAR_ARCHIVE_BUDGET || '22000' }}
      # Off until the maintainer turns it on (repository variable or manual run).
      ARCHIVE_PRUNE: ${{ inputs.prune || vars.PREPRINT_RADAR_ARCHIVE_PRUNE || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The latest main, not the commit the run was triggered on (see update.yml).
          ref: main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      # The catalog (about 100 MB) lives in the Actions cache, not in git. Each run saves a
      # new entry, even after a failure, so that an interrupted harvest resumes next time.
      - name: Restore the catalog
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-

      - name: Update the archive
        timeout-minutes: 280
        env:
          # Optional: without it, Semantic Scholar is queried anonymously, slowly. Given to
          # the steps that ask Semantic Scholar only.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=(--budget "$ARCHIVE_BUDGET")
          for category in $CATEGORIES; do args+=(--category "$category"); done
          if [ "$ARCHIVE_PRUNE" = "true" ]; then args+=(--prune); fi
          uv run --no-dev preprint-radar -v archive "${args[@]}"

      # The DOI, published venue and author ids of every stored paper, in scholar.json:
      # about 52 requests, minutes with a key. Even after a failed archive step, whose
      # papers are those of last week; a refusing Semantic Scholar leaves the old records.
      - name: Fetch the published versions
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v scholar --max-minutes 20 "${args[@]}"

      # Affiliations for the highly cited papers without any, from OpenAlex's record of
      # their published version (AFF-20): after scholar, whose DOIs it reads; seconds. No
      # HTML page: the maintainer reads those (`make archive-affiliations MAX_HTML=N`).
      - name: Ask OpenAlex for the affiliations of the published versions
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v archive-affiliations --max-ror 1000 "${args[@]}"

      # The country of the institutions those and the archive added, for the site's map
      # (UX-40): OpenAlex, 50 a request, seconds; those known already are not asked again.
      - name: Ask OpenAlex for the countries of the institutions
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v countries "${args[@]}"

      # The GitHub stars (Hugging Face likes) of the code the stored papers link, in
      # code.json (PROD-18): about 5 minutes, a query every 3 s, more when GitHub's limits
      # ask to wait. The workflow's own token reads public data.
      - name: Fetch the stars of the papers' code
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          for category in $CATEGORIES; do args+=(--category "$category"); done
          uv run --no-dev preprint-radar -v code "${args[@]}"

      - name: Save the catalog
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-${{ github.run_id }}

      # Even after a failed update: below the coverage gate, the archive step fails once it
      # has merged the counts it got, which are committed.
      - name: Validate data
        id: validate
        if: always()
        # Structural errors stop the push (see update.yml).
        run: bash .github/scripts/validate-data.sh

      - name: Commit data
        id: commit
        if: ${{ always() && steps.validate.outcome == 'success' }}
        # Replays the commit on main if it moved (see the script and update.yml).
        run: |
          bash .github/scripts/commit-data.sh "chore(data): archive $(date -u +%Y-%m-%d)"

      - name: Keep the data that failed validation
        if: ${{ always() && steps.validate.outcome == 'failure' }}
        run: |
          bash .github/scripts/commit-data.sh --keep "chore(data): archive $(date -u +%Y-%m-%d), not validated"

      - name: Keep the data commit that could not be pushed
        if: ${{ failure() && (steps.commit.outcome == 'failure' || steps.validate.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-commit
          path: data-commit.bundle
          retention-days: 7

      # The newest day and its age, the coverage tables and stale warnings, on the run's
      # page; the steps above add their own report lines.
      - name: Summary
        if: always()
        run: uv run --no-dev preprint-radar summary

  deploy:
    needs: archive
    # Whenever data was pushed, even by a run that failed (see update.yml).
    if: ${{ !cancelled() && needs.archive.outputs.pushed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
