# Weekly dependency updates. Actions are pinned by commit SHA (see CLAUDE.md): Dependabot
# bumps the SHA and keeps the version comment next to it. Minor and patch updates arrive
# grouped in one pull request per ecosystem; majors come one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
