# Weekly dependency updates. Actions are pinned by commit SHA (see CLAUDE.md): Dependabot
# bumps the SHA and keeps the version comment next to it. Minor and patch updates arrive
# grouped in one pull request per ecosystem; majors come one by one. Python and npm
# releases are proposed once 5 days old (14 for a major), so that a compromised one is
# likely pulled before it reaches us; security updates do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
