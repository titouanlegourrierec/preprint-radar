<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search recent arXiv papers by keyword, author and affiliation." />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser's bar takes the page's background, --bg of styles.css (theme-color.ts). -->
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <title>Preprint Radar</title>
    <!-- The store's index, which every view needs first, loads with the page rather than
         after the app's script: data.ts fetches the same URL in the same mode (PERF-14). -->
    <link rel="preload" href="./data/index.json" as="fetch" crossorigin />
    <!-- The theme forced with the toggle, before first paint: a file, not an inline script,
         which the Content-Security-Policy the build adds refuses (SEC-1). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
